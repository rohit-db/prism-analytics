bundle:
  name: prism-analytics

include:
  - resources/*.yml

variables:
  catalog:
    default: "bcd_adv_workspace_poc"
  schema:
    default: "apex"
  warehouse_id:
    default: "5cd3a4956df6152f"

targets:
  # The live demo target: the FEVM workspace holding the Prism Travel
  # Intelligence dashboard and Genie space (see .databricks-resources.json).
  fevm:
    default: true
    workspace:
      host: https://fevm-serverless-stable-71zsua.cloud.databricks.com
      profile: fevm-stable-71zsua
    variables:
      catalog: "serverless_stable_71zsua_catalog"
      schema: "prism_travel"
      warehouse_id: "28bc4299a384d531"
    resources:
      apps:
        prism-analytics:
          name: prism-analytics
          # Where `bundle deploy` syncs the files listed under `sync.include`.
          source_code_path: ${workspace.file_path}
          # NOTE: deliberately no `config:` block here. A `config:` in the bundle
          # overrides app.yaml, and keeping both in step by hand does not work —
          # they silently drifted once already, which cost an afternoon. app.yaml
          # ships with the source and is the single source of truth for the
          # command and every env var, including the `valueFrom:` references to
          # the resources below.
          #
          # Resources DO belong here: declaring them is what makes the bundle
          # grant the app's Service Principal access on deploy.
          resources:
            - name: sql-warehouse
              sql_warehouse:
                id: "28bc4299a384d531"
                permission: CAN_USE
            # User directory + tenant registry (apex_app_users,
            # apex_client_registry, apex_sp_credentials).
            - name: lakebase
              database:
                instance_name: "prism-edge"
                database_name: "databricks_postgres"
                permission: CAN_CONNECT_AND_CREATE
            # Signs/verifies the white-label session the edge gateway mints.
            - name: auth-session-secret
              secret:
                scope: "prism"
                key: "auth-session-secret"
                permission: READ
            # Decrypts tenant SP credentials at rest.
            - name: aes-key-base64
              secret:
                scope: "prism"
                key: "aes-key-base64"
                permission: READ
          user_api_scopes:
            - sql
            - genie

  # The original BCD customer POC workspace. Kept for reference; the demo assets
  # it points at live in a workspace we no longer deploy to. It still carries an
  # inline `config:` block because app.yaml is now FEVM-specific — deploying
  # this target again would mean re-pointing app.yaml instead.
  bcd:
    workspace:
      host: https://dbc-1e27e56a-90cd.cloud.databricks.com
      profile: bcd-customer
    variables:
      catalog: "bcd_adv_workspace_poc"
      schema: "apex"
    resources:
      apps:
        prism-analytics:
          name: prism-analytics
          source_code_path: /Workspace/Users/rohit.bhagwat@bcdtravel.com/advito-ai-bi
          config:
            command:
              - "python"
              - "-m"
              - "uvicorn"
              - "app:app"
              - "--host"
              - "0.0.0.0"
              - "--port"
              - "8000"
            env:
              - name: DASHBOARD_URL
                value: "https://dbc-1e27e56a-90cd.cloud.databricks.com/embed/dashboardsv3/01f1271698161d42b3c66528415775e8?o=1048934788948873"
              - name: MULTI_PAGE_DASHBOARD_URL
                value: "https://dbc-1e27e56a-90cd.cloud.databricks.com/embed/dashboardsv3/01f1271698161d42b3c66528415775e8?o=1048934788948873"
              - name: GENIE_SPACE_ID
                value: "01f127092d2219f3be10180d79b2ee5d"
              - name: GENIE_MCP_POLL_INTERVAL_MS
                value: "3000"
              - name: GENIE_MCP_POLL_MAX_ATTEMPTS
                value: "120"
          resources:
            - name: sql-warehouse
              sql_warehouse:
                id: "5cd3a4956df6152f"
                permission: CAN_USE
          user_api_scopes:
            - sql
            - genie

sync:
  include:
    - "app.py"
    - "app.yaml"
    - "requirements.txt"
    - "server/**"
    - "frontend/dist/**"
