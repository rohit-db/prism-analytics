command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: DASHBOARD_URL
    value: "https://fevm-serverless-stable-71zsua.cloud.databricks.com/embed/dashboardsv3/01f18f35b8561fb79677c244188f4c16?o=7474654199269365"
  - name: MULTI_PAGE_DASHBOARD_URL
    value: "https://fevm-serverless-stable-71zsua.cloud.databricks.com/embed/dashboardsv3/01f18f35b8561fb79677c244188f4c16?o=7474654199269365"
  - name: GENIE_SPACE_ID
    value: "01f18f363d9e193495d201f4b836151d"

  # Managed Genie MCP server polling (Genie agent turns take ~70-260s).
  - name: GENIE_MCP_POLL_INTERVAL_MS
    value: "3000"
  - name: GENIE_MCP_POLL_MAX_ATTEMPTS
    value: "120"

  # --- white-label session gate -------------------------------------------
  # ON so the app reads the identity the edge gateway hands it. With this off
  # the app cannot tell tenants apart and serves everyone as the app SP, which
  # silently defeats the Unity Catalog row filter.
  - name: AUTH_ENABLED
    value: "true"
  # Must match the edge's AUTH_SESSION_SECRET — see scripts/deploy/sync_app_secrets.py.
  - name: AUTH_SESSION_SECRET
    valueFrom: auth-session-secret
  # Pinned rather than left to the default: the edge injects this exact cookie
  # name, and a mismatch is invisible (the app just sees no session).
  - name: AUTH_SESSION_COOKIE
    value: "prism_session"

  # --- Lakebase (user directory + tenant registry) -------------------------
  # PGHOST/PGPORT/PGDATABASE/PGSSLMODE are injected by the `lakebase` resource
  # below; PGUSER defaults to the app SP's injected DATABRICKS_CLIENT_ID.
  - name: LAKEBASE_ENABLED
    value: "true"
  - name: LAKEBASE_INSTANCE_NAME
    value: "prism-edge"
  - name: LAKEBASE_ENDPOINT_PATH
    value: "projects/prism-edge/branches/production/endpoints/primary"

  # --- per-tenant Service Principal isolation ------------------------------
  # Decrypts tenant SP secrets stored in Lakebase. Rotating this orphans every
  # stored credential, so treat it as write-once.
  - name: AES_KEY_BASE64
    valueFrom: aes-key-base64
  - name: UC_CATALOG
    value: "serverless_stable_71zsua_catalog"
  - name: UC_SCHEMA
    value: "prism_travel"
  - name: VERIFY_TABLE
    value: "serverless_stable_71zsua_catalog.prism_travel.summarydataset"
  # The governed fact table names its tenant column `client_id`, not the default
  # `tenant_id`. The mapping table (sp_tenant_mapping) does use the defaults.
  - name: TENANT_COLUMN
    value: "client_id"
  - name: TENANT_LABEL_COLUMN
    value: "client_name"

resources:
  - name: sql-warehouse
    sql_warehouse:
      id: "28bc4299a384d531"
      permission: CAN_USE
  - name: lakebase
    database:
      instance_name: "prism-edge"
      database_name: "databricks_postgres"
      permission: CAN_CONNECT_AND_CREATE
  - name: auth-session-secret
    secret:
      scope: "prism"
      key: "auth-session-secret"
      permission: READ
  - name: aes-key-base64
    secret:
      scope: "prism"
      key: "aes-key-base64"
      permission: READ

user_api_scopes:
  - sql
  - genie
